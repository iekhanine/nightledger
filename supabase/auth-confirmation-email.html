<!doctype html>
<html>
  <body
    style="
      margin:0;
      padding:0;
      background:#0f171c;
      font-family:Arial,Helvetica,sans-serif;
      color:#f3f7f8;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      role="presentation"
      style="background:#0f171c;padding:32px 16px;"
    >
      <tr>
        <td align="center">
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="
              max-width:520px;
              background:#152229;
              border:1px solid #2e434e;
              border-radius:16px;
              overflow:hidden;
            "
          >
            <tr>
              <td style="padding:26px 28px 12px;">
                <div
                  style="
                    display:inline-block;
                    padding:9px 11px;
                    background:#173744;
                    border:1px solid #42606e;
                    border-radius:10px;
                    font-size:13px;
                    font-weight:700;
                  "
                >
                  NL
                </div>

                <h1
                  style="
                    margin:18px 0 6px;
                    font-size:24px;
                    line-height:1.2;
                    color:#f3f7f8;
                  "
                >
                  Confirm your NightLedger account
                </h1>

                <p
                  style="
                    margin:0;
                    color:#9aadb6;
                    font-size:14px;
                    line-height:1.6;
                  "
                >
                  Confirm this email address to finish creating your
                  NightLedger management account.
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding:14px 28px 28px;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display:inline-block;
                    padding:13px 18px;
                    background:#1c5369;
                    border-radius:10px;
                    color:#ffffff;
                    text-decoration:none;
                    font-size:14px;
                    font-weight:700;
                  "
                >
                  Confirm email
                </a>

                <p
                  style="
                    margin:20px 0 0;
                    color:#718792;
                    font-size:11px;
                    line-height:1.6;
                  "
                >
                  After confirmation, you will return directly to
                  NightLedger Admin.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
